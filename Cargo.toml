[package]
name = "quire-gpui"
version = "0.1.0"
edition = "2024"
description = "Quire GPUI desktop — first working editor slice"
default-run = "quire-gpui"

[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "1.12"
quire-core = { git = "https://github.com/PT123123/quire-core.git", rev = "b73af898f88eaa35620b654c6d9b78d8022f56c4" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "=0.15.4"
url = "=2.5.8"
raw-window-handle = "=0.6.2"

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }

[profile.dev]
debug = 1

[profile.test]
debug = 1
