[package]
name = "quire-gpui"
version = "0.1.23"
edition = "2024"
description = "Quire GPUI desktop — first working editor slice"
default-run = "quire-gpui"

[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "1.12"
# Sync pins move with the other shells: dcfc2bf carries the discovery answers
# (unicast hello on every beat, multicast road, bounded request reader) and
# one_address_one_row — the manual round dials one row per address, freshest
# first, and the info handshake gives up on silence in two seconds.
quire-core = { git = "https://github.com/PT123123/quire-core.git", rev = "4778b652190ba698291490f2f597589c7102f780" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "=0.15.4"
url = "=2.5.8"
raw-window-handle = "=0.6.2"

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }

[profile.dev]
debug = 1

[profile.test]
debug = 1
